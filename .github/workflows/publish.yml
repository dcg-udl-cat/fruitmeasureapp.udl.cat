name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      BABELQUARTO_CI_URL: https://fruitmeasureapp.udl.cat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
           version: "1.8.23"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libxslt1-dev \
            libuv1-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Install babelquarto
        shell: Rscript {0}
        run: |
          options(
            repos = c(
              "https://ropensci.r-universe.dev",
              "https://cloud.r-project.org"
            )
          )

          install.packages(
            "babelquarto",
            dependencies = TRUE
          )

      - name: Render Website
        run: Rscript -e 'babelquarto::render_website( site_url = Sys.getenv("BABELQUARTO_CI_URL"))'

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}