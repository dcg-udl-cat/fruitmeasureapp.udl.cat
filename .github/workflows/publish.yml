name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      BABELQUARTO_CI_URL: https://fruitmeasureapp.udl.cat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev

      - name: Install babelquarto
        shell: Rscript {0}
        run: |
          options(
            repos = c(
              ropensci = "https://ropensci.r-universe.dev",
              CRAN = "https://cloud.r-project.org"
            ),
            Ncpus = parallel::detectCores()
          )

          install.packages(
            "babelquarto",
            dependencies = TRUE,
            verbose = TRUE
          )

      - name: Verify installation
        shell: Rscript {0}
        run: |
          sessionInfo()
          packageVersion("babelquarto")
          packageVersion("quarto")

      - name: Render website
        shell: Rscript {0}
        run: |
          babelquarto::render_website(
            site_url = Sys.getenv("BABELQUARTO_CI_URL")
          )

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}