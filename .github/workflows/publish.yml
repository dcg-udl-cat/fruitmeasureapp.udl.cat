on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BABELQUARTO_CI_URL: "https://fruitmeasureapp.udl.cat"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-babelquarto
          restore-keys: r-${{ runner.os }}-babelquarto

      - name: Install babelquarto
        shell: Rscript {0}
        run: |
          install.packages(
            'babelquarto',
            repos = c('https://ropensci.r-universe.dev', 'https://cloud.r-project.org')
          )

      - name: Render site
        shell: Rscript {0}
        run: |
          babelquarto::render_website(
            site_url = Sys.getenv("BABELQUARTO_CI_URL")
          )

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
