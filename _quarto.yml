metadata-files:
  - _brand.yml
 
project:
  type: website
  output-dir: docs

lang: en

website:
  site-url: "https://fruitmeasureapp.udl.cat" # for local test change it to "file:///..."
  favicon: assets/logos/logo.png
  search: true
  title: "FruitMeasureApp"
  open-graph: true
  twitter-card: true
 
format:
  html:
    theme:
      light: [cosmos, assets/styles/theme-light.scss]
    css: 
      - assets/styles/custom.css
    toc: false
    page-layout: full
    highlight-style: github
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll("a[href]").forEach(function (link) {
            var href = link.getAttribute("href");
            // Only external links (absolute http/https to a different host)
            if (/^https?:\/\//i.test(href) && link.hostname !== window.location.hostname) {
              link.setAttribute("target", "_blank");
              link.setAttribute("rel", "noopener noreferrer");
            }
          });
        });
        </script>

babelquarto:
  languagelinks: navbar
  languagecodes:
    - name: en
      text: "EN"
    - name: ca
      text: "CA"
    - name: es
      text: "ES"
  mainlanguage: "ca"
  languages: ["en", "es"]

